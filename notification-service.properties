spring.boot.message=Notification Service

# R2DBC & Pool Settings
spring.r2dbc.url=r2dbc:pool:mariadb://mariadb:3306/notification_db?initialSize=5&maxSize=20&maxIdleTime=PT30M&validationQuery=SELECT%201
spring.r2dbc.username=root
spring.r2dbc.password=root

# Flyway
spring.flyway.enabled=false
spring.flyway.url=jdbc:mariadb://mariadb:3306/notification_db
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.driver-class-name=org.mariadb.jdbc.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

management.endpoints.web.exposure.include=health,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always

management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.propagation.type=w3c

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost

logging.file.path=/app/logs
logging.file.name=ProdEmailService
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId},%X{spanId}]

spring.messages.basename=ValidationMessages

spring.reactor.context-propagation=AUTO

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs

# Kafka - unified bootstrap property
spring.kafka.bootstrap-servers=kafka:9092

# Consumer-specific
spring.kafka.consumer.group-id=email
spring.kafka.consumer.auto-offset-reset=latest

# Topic names
spring.kafka.topic.name=order_topics
spring.kafka.dlq.topic=email_dlq

# Timeouts / tuning
app.email.max-retries=3
app.email.send-timeout-seconds=10
app.email.retry-backoff-ms=2000
app.consumer.shutdown-wait-ms=30000