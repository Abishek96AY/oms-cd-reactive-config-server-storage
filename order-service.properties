spring.boot.message=Order Service

# R2DBC & Pool Settings
spring.r2dbc.url=r2dbc:pool:mariadb://localhost:3306/order_db?initialSize=5&maxSize=20&maxIdleTime=PT30M&validationQuery=SELECT%201
spring.r2dbc.username=root
spring.r2dbc.password=root

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*

management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.propagation.type=w3c

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# For Logs
logging.file.path=D:/AY/Work/Projects/Java/Logs
logging.file.name=OrderService
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId},%X{spanId}]

spring.messages.basename=ValidationMessages

spring.reactor.context-propagation=AUTO
#################################################################################################

# Kafka bootstrap
spring.kafka.bootstrap-servers=localhost:9092

# Topic names
spring.kafka.topic.name=order_topics
spring.kafka.dlq.topic=order_dlq

# Producer send retry / timeout tuning
app.producer.send-timeout-ms=10000
app.producer.max-retries=3
app.producer.retry-backoff-ms=200