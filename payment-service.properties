resilience4j.circuitbreaker.instances.token-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.token-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.token-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.token-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.token-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.token-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.token-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.token-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.token-service.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.token-service.slowCallDurationThreshold=2s

# ========== Token Service Time Limiter Configuration ==========
resilience4j.timelimiter.instances.token-service.timeoutDuration=2s
resilience4j.timelimiter.instances.token-service.cancelRunningFuture=true

# ========== Switch Service Circuit Breaker Configuration ==========
