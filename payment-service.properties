spring.boot.message=Payment Service

# R2DBC & Pool Settings
spring.r2dbc.url=r2dbc:pool:mariadb://localhost:3306/payment_db?initialSize=5&maxSize=20&maxIdleTime=PT30M&validationQuery=SELECT%201
spring.r2dbc.username=root
spring.r2dbc.password=root

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.propagation.type=w3c

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# For Logs
logging.file.path=D:/AY/Work/Projects/Java/Logs
logging.file.name=Payment
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId},%X{spanId}]

spring.messages.basename=ValidationMessages

spring.reactor.context-propagation=AUTO

# To generate transaction id
snowflake.node-id=1

# Configure batch size for reversal processing
scheduling.reversal.batch.upload.size=50
# Configure job interval for reversal processing (in milliseconds)
scheduling.reversal.job.upload.interval=1800000

# Config for purging soft-deleted records. Cron expression for weekly execution (every Sunday)
scheduling.reversal.purge.interval=0 0 0 * * SUN
# Purge records older than 30 days
scheduling.reversal.purge.threshold.days=30

# ========== Payment Service Circuit Breaker Configuration ==========
resilience4j.circuitbreaker.instances.payment-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.payment-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.payment-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.payment-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.payment-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.payment-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.payment-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.payment-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.payment-service.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.payment-service.slowCallDurationThreshold=2s

# ========== Registration Service Circuit Breaker Configuration ==========
resilience4j.circuitbreaker.instances.registration-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.registration-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.registration-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.registration-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.registration-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.registration-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.registration-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.registration-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.registration-service.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.registration-service.slowCallDurationThreshold=2s

# ========== Registration Service Time Limiter Configuration ==========
resilience4j.timelimiter.instances.registration-service.timeoutDuration=2s
resilience4j.timelimiter.instances.registration-service.cancelRunningFuture=true

# ========== Registration Service Retry Configuration ==========
resilience4j.retry.instances.registration-service.maxAttempts=2
resilience4j.retry.instances.registration-service.waitDuration=500ms
resilience4j.retry.instances.registration-service.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException
resilience4j.retry.instances.registration-service.ignoreExceptions=org.springframework.web.reactive.function.client.WebClientResponseException$NotFound

