resilience4j.circuitbreaker.instances.switch-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.switch-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.switch-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.switch-service.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.switch-service.slowCallDurationThreshold=2s

