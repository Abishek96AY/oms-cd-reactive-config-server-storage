spring.boot.message=Product Service

# R2DBC & Pool Settings
spring.r2dbc.url=r2dbc:pool:mariadb://localhost:3306/product_db?initialSize=5&maxSize=20&maxIdleTime=PT30M&validationQuery=SELECT%201
spring.r2dbc.username=root
spring.r2dbc.password=root

eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*

management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.propagation.type=w3c

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# For Logs
logging.file.path=D:/AY/Work/Projects/Java/Logs
logging.file.name=Product
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId},%X{spanId}]

spring.messages.basename=ValidationMessages

spring.reactor.context-propagation=AUTO

# Redis system settings
spring.data.redis.host=localhost
#spring.data.redis.password=yourRedisPassword
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=60000

# Cache Configuration
cache.product.redisTtlMinutes=15

# Resilience4j - CircuitBreaker [Product]
resilience4j.circuitbreaker.instances.redisProductCacheService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.redisProductCacheService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.redisProductCacheService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redisProductCacheService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.redisProductCacheService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.redisProductCacheService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.redisProductCacheService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.redisProductCacheService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.redisProductCacheService.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.redisProductCacheService.slowCallDurationThreshold=2s

# Resilience4j - Retry [Product]
resilience4j.retry.instances.redisProductCacheService.maxAttempts=3
resilience4j.retry.instances.redisProductCacheService.waitDuration=500ms
resilience4j.retry.instances.redisProductCacheService.retryExceptions=org.springframework.data.redis.RedisConnectionFailureException,java.io.IOException

# Resilience4j - TimeLimiter [Product]
resilience4j.timelimiter.instances.redisProductCacheService.timeoutDuration=2s
resilience4j.timelimiter.instances.redisProductCacheService.cancelRunningFuture=true