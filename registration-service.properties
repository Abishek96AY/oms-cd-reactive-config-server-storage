spring.boot.message=Registration Service

# R2DBC & Pool Settings
spring.r2dbc.url=r2dbc:pool:mariadb://mariadb:3306/registration_db?initialSize=5&maxSize=20&maxIdleTime=PT30M&validationQuery=SELECT%201
spring.r2dbc.username=root
spring.r2dbc.password=root

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:mariadb://mariadb:3306/registration_db
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.driver-class-name=org.mariadb.jdbc.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.propagation.type=w3c

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost

# For Logs
logging.file.path=/app/logs
logging.file.name=ProdRegistration
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId},%X{spanId}]

spring.messages.basename=ValidationMessages

spring.reactor.context-propagation=AUTO

# ====== Cache Configuration ======

# Onboard cache settings
cache.onboard.expiryMinutes=2
cache.onboard.redisTtlMinutes=2
cache.onboard.maximumSize=1000

# Registration cache settings
cache.registration.expiryMinutes=2
cache.registration.redisTtlMinutes=2
cache.registration.maximumSize=1000

# Redis system settings
spring.data.redis.host=redis
#spring.data.redis.password=yourRedisPassword
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=60000

# =======================
# Resilience4j - CircuitBreaker (Onboard)
# =======================
resilience4j.circuitbreaker.instances.redisOnboardCacheService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.redisOnboardCacheService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.redisOnboardCacheService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redisOnboardCacheService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.redisOnboardCacheService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.redisOnboardCacheService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.redisOnboardCacheService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.redisOnboardCacheService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.redisOnboardCacheService.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.redisOnboardCacheService.slowCallDurationThreshold=2s

# =======================
# Resilience4j - Retry (Onboard)
# =======================
resilience4j.retry.instances.redisOnboardCacheService.maxAttempts=3
resilience4j.retry.instances.redisOnboardCacheService.waitDuration=500ms
resilience4j.retry.instances.redisOnboardCacheService.retryExceptions=org.springframework.data.redis.RedisConnectionFailureException,java.io.IOException

# =======================
# Resilience4j - TimeLimiter (Onboard)
# =======================
resilience4j.timelimiter.instances.redisOnboardCacheService.timeoutDuration=2s
resilience4j.timelimiter.instances.redisOnboardCacheService.cancelRunningFuture=true

# =======================
# Resilience4j - CircuitBreaker (Registration)
# =======================
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.redisRegistrationCacheService.slowCallDurationThreshold=2s

# =======================
# Resilience4j - Retry (Registration)
# =======================
resilience4j.retry.instances.redisRegistrationCacheService.maxAttempts=3
resilience4j.retry.instances.redisRegistrationCacheService.waitDuration=500ms
resilience4j.retry.instances.redisRegistrationCacheService.retryExceptions=org.springframework.data.redis.RedisConnectionFailureException,java.io.IOException

# =======================
# Resilience4j - TimeLimiter (Registration)
# =======================
resilience4j.timelimiter.instances.redisRegistrationCacheService.timeoutDuration=2s
resilience4j.timelimiter.instances.redisRegistrationCacheService.cancelRunningFuture=true