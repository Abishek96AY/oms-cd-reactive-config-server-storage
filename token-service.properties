spring.boot.message=Token Service

# R2DBC & Pool Settings
spring.r2dbc.url=r2dbc:pool:mariadb://mariadb:3306/token_db?initialSize=5&maxSize=20&maxIdleTime=PT30M&validationQuery=SELECT%201
spring.r2dbc.username=root
spring.r2dbc.password=root

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:mariadb://mariadb:3306/token_db
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.driver-class-name=org.mariadb.jdbc.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.propagation.type=w3c

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost

logging.file.path=/app/logs
logging.file.name=ProdToken
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId},%X{spanId}]

spring.messages.basename=ValidationMessages

spring.reactor.context-propagation=AUTO

# Token cleanup settings
token.cleanup.enabled=true
token.cleanup.dry-run=false

token.cleanup.age-days=0
token.cleanup.interval-days=1
token.cleanup.time=15:45

token.cleanup.batch-size=5000
token.cleanup.worker-concurrency=1
token.cleanup.max-retry-attempts=3
token.cleanup.initial-backoff-ms=2000
token.cleanup.batch-delay-ms=500