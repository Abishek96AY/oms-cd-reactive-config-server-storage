spring.boot.message=Token Service

# R2DBC & Pool Settings
spring.r2dbc.url=r2dbc:pool:mariadb://localhost:3306/token_db?initialSize=5&maxSize=20&maxIdleTime=PT30M&validationQuery=SELECT%201
spring.r2dbc.username=root
spring.r2dbc.password=root

eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*

management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.tracing.propagation.type=w3c

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

logging.file.path=D:/AY/Work/Projects/Java/Logs
logging.file.name=Token
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId},%X{spanId}]

spring.messages.basename=ValidationMessages

spring.reactor.context-propagation=AUTO

# Token cleanup settings
token.cleanup.enabled=true
token.cleanup.dry-run=false

token.cleanup.age-days=0
token.cleanup.interval-days=1
token.cleanup.time=15:45

token.cleanup.batch-size=5000
token.cleanup.worker-concurrency=1
token.cleanup.max-retry-attempts=3
token.cleanup.initial-backoff-ms=2000
token.cleanup.batch-delay-ms=500